# .github/workflows/ai-sdlc.yml — thin caller for the AI-SDLC pipeline.
# Generated by `ai-sdlc init`; reusable stages live in os-santiago/ai-sdlc
# (pinned @main — pin a tag for stability). Docs: docs/runtime.md +
# docs/onboarding.md in that repo.
name: ai-sdlc

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, synchronize]
  check_run:
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to re-drive through the merge gate'
        type: number
        required: false

# Called stages declare their own job permissions; a caller grant can narrow
# them, never widen — this union covers every stage (runtime.md §Inputs).
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read
  statuses: read
  models: read

jobs:
  # One-shot label bootstrap (spec/labels.md): run once after merge —
  # Actions → ai-sdlc → Run workflow. Creates missing labels only; existing
  # labels are never modified. The bootstrap PR carries this job, so no
  # direct API label writes happen before merge.
  labels-bootstrap:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Create canonical ai-sdlc labels (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          create() {
            gh label create "$1" --color "$2" --description "$3" >/dev/null 2>&1 \
              && echo "created: $1" || echo "kept:    $1 (already exists)"
          }
            create "ready-to-implement" 0e8a16 "Dispatch trigger — issue is DoR-ready for the ai-sdlc pipeline"
            create "needs-refinement" d4c5f9 "DoR hold — needs a clearer spec before dispatch"
            create "needs-human" b60205 "Human hold — vetoes dispatch and merge while present"
            create "ai-sdlc" 1d76db "Opt-in — marks a human-authored PR pipeline-managed"
            create "scc:queued" fbca04 "Run state — run queued"
            create "scc:in-progress" fbca04 "Run state — run in progress"
            create "scc:pr-opened" 0e8a16 "Run state — run opened a PR"
            create "scc:failed" d93f0b "Run state — run failed (see issue comments)"
            create "scc:not-ready" d4c5f9 "DoR/config hold — refinement required"
            create "scc:no-changes" d4c5f9 "Run state — finished with no workspace mutations"
            create "pr:risk-low" 0e8a16 "Risk tier: low"
            create "pr:risk-medium" fbca04 "Risk tier: medium"
            create "pr:risk-high" d93f0b "Risk tier: high"
            create "pr:risk-critical" b60205 "Risk tier: critical — merge requires pr:risk-accepted"
            create "pr:risk-accepted" 5319e7 "Human acceptance of a critical-risk PR"

  # Intake: 'ready-to-implement' → DoR check → scc:queued. Keep the label
  # name in sync with triggers.issue_label in .ai-sdlc.yaml.
  intake:
    if: github.event_name == 'issues' && github.event.label.name == 'ready-to-implement'
    uses: os-santiago/ai-sdlc/.github/workflows/ai-sdlc-intake.yml@main
    with:
      repo: ${{ github.repository }}
      issue_number: ${{ github.event.issue.number }}
    secrets:
      AI_SDLC_TOKEN: ${{ secrets.AI_SDLC_TOKEN }}
      AI_SDLC_APP_ID: ${{ secrets.AI_SDLC_APP_ID }}
      AI_SDLC_APP_PRIVATE_KEY: ${{ secrets.AI_SDLC_APP_PRIVATE_KEY }}
      AI_SDLC_LEDGER_KEY: ${{ secrets.AI_SDLC_LEDGER_KEY }}

  implement:
    needs: intake
    if: needs.intake.outputs.dispatch == 'true'
    uses: os-santiago/ai-sdlc/.github/workflows/ai-sdlc-implement.yml@main
    with:
      repo: ${{ github.repository }}
      issue_number: ${{ github.event.issue.number }}
      ledger_head: ${{ needs.intake.outputs.ledger_head }}
    secrets:
      AI_SDLC_APP_ID: ${{ secrets.AI_SDLC_APP_ID }}
      AI_SDLC_APP_PRIVATE_KEY: ${{ secrets.AI_SDLC_APP_PRIVATE_KEY }}
      AI_SDLC_LEDGER_KEY: ${{ secrets.AI_SDLC_LEDGER_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}

  # Deterministic pr:risk-* labeling on every same-repo PR head.
  classify:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: os-santiago/ai-sdlc/.github/workflows/ai-sdlc-classify.yml@main
    with:
      repo: ${{ github.repository }}
      pr_number: ${{ github.event.pull_request.number }}
    secrets:
      AI_SDLC_APP_ID: ${{ secrets.AI_SDLC_APP_ID }}
      AI_SDLC_APP_PRIVATE_KEY: ${{ secrets.AI_SDLC_APP_PRIVATE_KEY }}

  # AI review + bounded review-fix convergence. Fork heads carry no
  # secrets — filtered here so they skip cleanly.
  review:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: os-santiago/ai-sdlc/.github/workflows/ai-sdlc-review.yml@main
    with:
      repo: ${{ github.repository }}
      pr_number: ${{ github.event.pull_request.number }}
    secrets:
      AI_SDLC_APP_ID: ${{ secrets.AI_SDLC_APP_ID }}
      AI_SDLC_APP_PRIVATE_KEY: ${{ secrets.AI_SDLC_APP_PRIVATE_KEY }}
      AI_SDLC_LEDGER_KEY: ${{ secrets.AI_SDLC_LEDGER_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}

  # Merge gate: on PR events, on check completion, and manually
  # (Actions → ai-sdlc → Run workflow with a PR number).
  automerge:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'check_run' &&
       github.event.check_run.pull_requests[0] != null) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.pr)
    uses: os-santiago/ai-sdlc/.github/workflows/ai-sdlc-automerge.yml@main
    with:
      repo: ${{ github.repository }}
      pr_number: ${{ github.event.inputs.pr || github.event.pull_request.number || github.event.check_run.pull_requests[0].number }}
    secrets:
      AI_SDLC_APP_ID: ${{ secrets.AI_SDLC_APP_ID }}
      AI_SDLC_APP_PRIVATE_KEY: ${{ secrets.AI_SDLC_APP_PRIVATE_KEY }}
      AI_SDLC_LEDGER_KEY: ${{ secrets.AI_SDLC_LEDGER_KEY }}

  # Bounded CI repair on red checks associated with a PR.
  ci-repair:
    if: >-
      github.event_name == 'check_run' &&
      github.event.check_run.conclusion == 'failure' &&
      github.event.check_run.pull_requests[0] != null
    uses: os-santiago/ai-sdlc/.github/workflows/ai-sdlc-ci-repair.yml@main
    with:
      repo: ${{ github.repository }}
      pr_number: ${{ github.event.check_run.pull_requests[0].number }}
    secrets:
      AI_SDLC_APP_ID: ${{ secrets.AI_SDLC_APP_ID }}
      AI_SDLC_APP_PRIVATE_KEY: ${{ secrets.AI_SDLC_APP_PRIVATE_KEY }}
      AI_SDLC_LEDGER_KEY: ${{ secrets.AI_SDLC_LEDGER_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}

  # Post-merge verify of the contract's verify.commands on the base branch.
  verify:
    if: github.event_name == 'push'
    uses: os-santiago/ai-sdlc/.github/workflows/ai-sdlc-verify.yml@main
    with:
      repo: ${{ github.repository }}
      base: main
    secrets:
      AI_SDLC_TOKEN: ${{ secrets.AI_SDLC_TOKEN }}
      AI_SDLC_LEDGER_KEY: ${{ secrets.AI_SDLC_LEDGER_KEY }}
