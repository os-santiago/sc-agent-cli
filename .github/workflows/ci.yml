name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    name: test (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One leg must not cancel the others — a Windows-only regression should
      # still report the Linux results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # engines claims >=20.0.0 — CI covers every released major in that
        # range on Linux (20/22 maintenance LTS, 24 active LTS, 26 current).
        # (#509)
        node-version: [20, 22, 24, 26]
        include:
          # #484 — the project claims Windows/macOS/Linux/WSL support; verify
          # it. Non-Linux legs pin Node 22 to bound runner cost while Linux
          # keeps the full Node 20/22/24/26 runtime matrix. The platform-relevant
          # suite (path-security, shell-env inputs, dangerous-commands,
          # sandbox degraded mode) runs in full — it is the unit suite.
          - os: windows-latest
            node-version: 22
          - os: macos-latest
            node-version: 22

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - run: npm test

      - run: npm run test:e2e

      - run: npm run test:coverage
        env:
          CI: true

      - name: Coverage summary
        if: always()
        # bash everywhere: pwsh maps `mkdir -p` to New-Item, which errors when
        # coverage/ already exists (vitest creates it). Git Bash is present on
        # windows runners and is the default shell on Linux/macOS.
        shell: bash
        run: |
          mkdir -p coverage
          node scripts/coverage-summary.mjs | tee coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on PR
        if: always() && github.event_name == 'pull_request' && matrix.node-version == 22 && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = `<!-- coverage-gate -->\n### Coverage — Node ${{ matrix.node-version }}\n\n${fs.readFileSync('coverage/summary.md', 'utf8').trim()}`;
            } catch {
              body = '<!-- coverage-gate -->\nCoverage report unavailable — the coverage step failed before producing a summary.';
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes('<!-- coverage-gate -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-report-${{ matrix.os }}-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7

  # #487 — the release artifact was never exercised: this packs exactly what a
  # consumer would receive and runs the shipped bin, so a broken `files`
  # whitelist or missing dist/ entry is caught before a release, not after.
  package-smoke:
    name: package smoke (npm pack)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Pack artifact and verify contents whitelist
        shell: bash
        run: |
          npm pack --dry-run
          TARBALL=$(npm pack)
          # npm always adds package.json (+ README/LICENSE via the whitelist);
          # anything outside these prefixes means the `files` field drifted.
          BAD=$(tar -tzf "$TARBALL" | grep -vE '^package/(package\.json|bin/|dist/|README[^/]*$|LICENSE[^/]*$)' || true)
          if [ -n "$BAD" ]; then
            echo "Packed artifact contains non-whitelisted files:"
            echo "$BAD"
            exit 1
          fi
          tar -tzf "$TARBALL"

      - name: Smoke-run the packed bin
        shell: bash
        run: |
          TARBALL=$(npm pack)
          mkdir -p .pack-smoke
          tar -xzf "$TARBALL" -C .pack-smoke
          node .pack-smoke/package/bin/sc.js --version
